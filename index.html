<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>総務課 進捗管理</title>
<style>
  :root{
    --bg:#F3F5F7;
    --surface:#FFFFFF;
    --surface-alt:#EEF1F4;
    --ink:#1B2430;
    --ink-muted:#6B7684;
    --ink-faint:#9AA3AF;
    --line:#DEE3E8;
    --line-strong:#C7CFD6;
    --accent:#1E5F74;
    --accent-ink:#12414F;
    --accent-soft:#E3EEF0;
    --accent-soft-strong:#CFE3E6;
    --danger:#B84A3E;
    --danger-soft:#F6E4E1;
    --warn:#B5711F;
    --warn-soft:#F5E8D6;
    --good:#2E7D53;
    --good-soft:#DEEFE4;
    --hold:#6E5FA3;
    --hold-soft:#E7E2F3;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --shadow-1:0 1px 2px rgba(20,30,40,0.06), 0 1px 1px rgba(20,30,40,0.04);
    --shadow-2:0 8px 24px rgba(20,30,40,0.12), 0 2px 6px rgba(20,30,40,0.06);
    --font-jp:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    --font-mono:"SF Mono","Menlo","Consolas",monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-jp);
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1360px;margin:0 auto;padding:28px 28px 80px;}

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .logo-img{
    height:46px;width:auto;flex-shrink:0;
    display:block;
  }
  .brand-text h1{
    margin:0;
    font-size:23px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  .brand-text p{
    margin:3px 0 0;
    font-size:12.5px;
    color:var(--ink-muted);
    letter-spacing:0.02em;
  }
  .live-badge{
    display:inline-flex;align-items:center;gap:6px;
    margin-left:10px;
    font-size:11px;
    color:var(--good);
    background:var(--good-soft);
    padding:3px 9px 3px 7px;
    border-radius:999px;
    font-weight:600;
    vertical-align:middle;
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;background:var(--good);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(46,125,83,0.5);}
    70%{box-shadow:0 0 0 5px rgba(46,125,83,0);}
    100%{box-shadow:0 0 0 0 rgba(46,125,83,0);}
  }

  /* ---------- Fixed top area (header + meetings) ---------- */
  .sticky-top{
    position:sticky;top:0;z-index:50;
    background:var(--bg);
    margin:-28px -28px 0;
    padding:16px 28px 2px;
    transition:box-shadow .15s;
  }
  .sticky-top.stuck{box-shadow:0 6px 12px -8px rgba(20,30,40,0.25);}
  .sticky-top .header{margin-bottom:14px;}
  .sticky-top .meetings{margin-bottom:14px;}
  @media (max-width:720px){
    /* スマホでは固定エリアが画面の大半を占めるため固定しない */
    .sticky-top{position:static;margin:0;padding:0;}
    .sticky-top.stuck{box-shadow:none;}
  }

  /* ---------- Weekly meetings ---------- */
  .meetings{
    margin:0 0 18px;
    display:grid;
    grid-template-columns:auto 1fr auto 1fr;
    align-items:stretch;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-l);
    box-shadow:var(--shadow-1);
    overflow:hidden;
  }
  .mt-head{
    display:flex;flex-direction:column;justify-content:center;
    padding:10px 18px;
    background:var(--surface-alt);
    border-right:1px solid var(--line);
    font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.35;
    white-space:nowrap;
  }
  .mt-head small{font-size:11px;font-weight:500;color:var(--ink-muted);}
  .mt{
    position:relative;
    display:flex;align-items:center;gap:14px;
    padding:10px 18px;
    min-width:0;
  }
  /* 平日5日のミニカレンダー。開催曜日だけを塗りつぶし、週の中の位置を示す */
  .mt-week{
    flex-shrink:0;
    display:grid;grid-template-columns:repeat(5, 21px);gap:3px;
  }
  .mt-week span{
    height:34px;border-radius:5px;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;
    font-size:11.5px;font-weight:800;line-height:1;
    color:var(--ink-faint);
    background:var(--surface-alt);
    box-shadow:inset 0 3px 0 var(--line-strong);
  }
  .mt-week span.on{
    color:var(--accent-ink);
    background:var(--accent-soft-strong);
    box-shadow:inset 0 3px 0 var(--accent);
  }
  .mt-body{min-width:0;}
  .mt-dow{color:var(--accent-ink);font-weight:800;}
  .mt-when{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:12px;color:var(--ink-muted);font-weight:600;
  }
  .mt-time{
    font-size:22px;font-weight:900;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:-0.01em;line-height:1.1;
  }
  .mt-time small{font-size:12px;font-weight:700;color:var(--ink-muted);margin-left:2px;}
  .mt-title{font-size:14px;font-weight:800;color:var(--ink);line-height:1.35;margin-top:1px;}
  .mt-who{font-size:11.5px;color:var(--ink-muted);}
  .mt-side{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:10px;}
  .mt-pill{
    display:inline-block;
    font-size:11px;font-weight:700;
    padding:2px 9px;border-radius:999px;
    background:var(--surface-alt);color:var(--ink-muted);
    white-space:nowrap;
  }
  .mt-guide{
    font-size:11.5px;font-weight:700;color:var(--accent-ink);white-space:nowrap;
    padding:4px 10px;border-radius:var(--radius-s);
    background:var(--accent-soft);border:1px solid var(--accent-soft-strong);
  }
  /* 次に来るミーティングを強調 */
  .mt.is-next{background:linear-gradient(90deg, var(--accent-soft) 0%, var(--surface) 100%);}
  .mt.is-next::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);
  }
  .mt.is-next .mt-week span.on{background:var(--accent);color:#fff;box-shadow:inset 0 3px 0 var(--accent-ink);}
  .mt.is-next .mt-pill{background:var(--accent);color:#fff;}
  .mt.is-today .mt-pill{background:var(--warn);color:#fff;}
  /* 課内 → 役員 の流れを示す矢印 */
  .mt-arrow{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:0 6px;color:var(--ink-faint);
    font-size:10.5px;font-weight:700;white-space:nowrap;
  }
  .mt-arrow svg{display:block;}
  @media (max-width:1100px){
    .meetings{grid-template-columns:1fr auto 1fr;}
    .mt-head{grid-column:1 / -1;flex-direction:row;gap:10px;align-items:baseline;border-right:none;border-bottom:1px solid var(--line);padding:7px 18px;}
  }
  @media (max-width:720px){
    .meetings{grid-template-columns:1fr;}
    .mt-arrow{flex-direction:row;padding:2px 0;}
    .mt-arrow svg{transform:rotate(90deg);}
    .mt-time{font-size:19px;}
    .mt{gap:12px;padding:10px 14px;}
    .mt-week{grid-template-columns:repeat(5, 15px);gap:2px;}
    .mt-week span{height:28px;font-size:9.5px;padding-bottom:4px;}
  }

  /* ---------- Summary counts ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(3, auto);
    gap:10px;
  }
  .sum-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:4px solid var(--c);
    border-radius:var(--radius-m);
    padding:8px 14px;
    box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .sum-label{font-size:12.5px;font-weight:700;color:var(--ink);}
  .sum-label small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-faint);margin-top:1px;}
  .sum-num{font-size:28px;font-weight:900;color:var(--c);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
  .sum-num span{font-size:12px;font-weight:700;margin-left:3px;color:var(--ink-muted);}
  .sum-progress{--c:var(--accent);}
  .sum-hold{--c:var(--hold);}
  .sum-stale{--c:var(--danger);}
  .sum-stale{background:var(--danger-soft);border-color:#E9C4BE;border-left-color:var(--danger);}
  .sum-stale .sum-label{color:var(--danger);}
  .sum-stale .sum-num span{color:var(--danger);}
  .sum-stale.zero{--c:var(--ink-faint);background:var(--surface);border-color:var(--line);border-left-color:var(--ink-faint);}
  .sum-stale.zero .sum-label{color:var(--ink);}
  .sum-stale.zero .sum-num span{color:var(--ink-muted);}
  @media (max-width:720px){
    .summary{grid-template-columns:1fr;width:100%;}
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:12px 14px;
    margin-bottom:16px;
    box-shadow:var(--shadow-1);
  }
  .search-box{
    display:flex;align-items:center;gap:6px;
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    padding:7px 10px;
    flex:1 1 150px;
    min-width:110px;
  }
  .search-box input{
    border:none;background:transparent;outline:none;
    font-size:13px;font-family:var(--font-jp);color:var(--ink);
    width:100%;
  }
  .search-box svg{flex-shrink:0;opacity:0.5;}

  .status-filter-group{
    display:flex;align-items:center;gap:6px;
    padding:4px 6px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    background:var(--surface-alt);
  }
  .sfg-label{font-size:11.5px;color:var(--ink-muted);font-weight:700;padding-left:4px;letter-spacing:0.02em;}
  .sfg-chip{
    border:1.5px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink-muted);
    font-family:var(--font-jp);
    font-size:12px;font-weight:700;
    padding:5px 11px;border-radius:999px;
    cursor:pointer;
    transition:background .12s, color .12s, border-color .12s;
  }
  .sfg-chip:hover{border-color:var(--ink-faint);}
  .sfg-chip.sfg-進行中.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sfg-chip.sfg-保留.active{background:var(--hold);border-color:var(--hold);color:#fff;}
  .sfg-chip.sfg-完了.active{background:var(--good);border-color:var(--good);color:#fff;}
  .sfg-chip.sfg-却下.active{background:var(--danger);border-color:var(--danger);color:#fff;}

  @media (max-width:1180px){
    .toolbar{gap:8px;}
    .sfg-label{display:none;} /* 幅が狭いときは「ステータス」の文字を省いて1行に収める */
  }
  .exec-filter{
    display:inline-flex;align-items:center;gap:7px;
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-muted);
    font-family:var(--font-jp);font-size:12px;font-weight:700;
    padding:6px 11px;border-radius:var(--radius-s);cursor:pointer;
    transition:background .12s, color .12s, border-color .12s;
  }
  .exec-filter:hover{border-color:var(--accent);}
  .exec-filter .cnt{
    min-width:20px;padding:0 6px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-ink);
    font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;
  }
  .exec-filter.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .exec-filter.active .cnt{background:rgba(255,255,255,0.22);color:#fff;}

  select, .btn{
    font-family:var(--font-jp);
    font-size:13px;
  }
  select{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius-s);
    padding:7px 8px;
    color:var(--ink);
    outline:none;
    cursor:pointer;
  }
  select:hover{border-color:var(--line-strong);}


  .btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius-s);
    cursor:pointer;
    font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .12s, border-color .12s;
  }
  .btn:hover{background:var(--surface-alt);}
  .btn-primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-icon{padding:6px;border-radius:var(--radius-s);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- Table ---------- */
  .table-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
    box-shadow:var(--shadow-1);
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;
    padding:11px 12px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--line);
    font-size:11.5px;
    color:var(--ink-muted);
    font-weight:700;
    letter-spacing:0.03em;
    white-space:nowrap;
    user-select:none;
    cursor:pointer;
  }
  thead th:hover{color:var(--ink);}
  thead th .arrow{opacity:0;font-size:10px;margin-left:3px;}
  thead th.sorted .arrow{opacity:1;color:var(--accent);}
  thead th.no-sort{cursor:default;}
  thead th.no-sort:hover{color:var(--ink-muted);}

  tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:var(--surface-alt);}
  tbody tr.overdue-row{background:linear-gradient(to right, var(--danger-soft) 0 4px, transparent 4px);}
  tbody tr.expanded{background:var(--accent-soft);}
  td{padding:11px 12px;vertical-align:top;}
  .cell-assignee{font-weight:600;white-space:nowrap;}
  .cell-no{
    width:1%;white-space:nowrap;text-align:right;
    font-weight:800;font-size:13px;color:var(--ink-muted);
    font-variant-numeric:tabular-nums;
  }
  thead th.th-no{text-align:right;}
  .cell-exec{width:1%;text-align:center;}
  thead th.th-exec{text-align:center;}
  .exec-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;margin-top:6px;
    border:1.5px dashed var(--line-strong);border-radius:7px;
    background:var(--surface);color:transparent;
    cursor:pointer;padding:0;
    transition:border-color .12s, background .12s;
  }
  .exec-toggle:hover{border-color:var(--accent);border-style:solid;}
  .exec-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .exec-toggle.on{background:var(--accent);border:1.5px solid var(--accent);color:#fff;}
  .exec-toggle svg{display:block;}
  .exec-tag{
    display:inline-block;margin-left:6px;vertical-align:1px;
    font-size:10px;font-weight:800;
    color:var(--accent-ink);background:var(--accent-soft-strong);
    padding:1px 6px;border-radius:4px;
  }
  .cell-title{max-width:280px;}
  .cell-title .t{font-weight:600;color:var(--ink);}
  .cell-title .sub{color:var(--ink-muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .cell-date{font-family:var(--font-mono);white-space:nowrap;font-size:12.5px;}
  .overdue-tag{
    display:inline-block;margin-top:3px;font-size:10px;font-weight:700;
    color:var(--danger);background:var(--danger-soft);
    padding:1px 6px;border-radius:4px;letter-spacing:0.02em;
  }

  .pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.02em;
    white-space:nowrap;
  }

  /* stamp-style status chip */
  .stamp{
    display:inline-flex;
    align-items:center;justify-content:center;
    width:40px;height:40px;
    border-radius:50%;
    border:2px solid currentColor;
    font-size:11px;
    font-weight:700;
    writing-mode:vertical-rl;
    text-orientation:upright;
    letter-spacing:1px;
    transform:rotate(-3deg);
    position:relative;
    cursor:pointer;
  }
  .stamp::before{
    content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:50%;opacity:0.4;
  }
  .stamp-完了{color:var(--good);}
  .stamp-進行中{color:var(--accent);}
  .stamp-保留{color:var(--hold);}
  .stamp-却下{color:var(--danger);}

  .row-actions{display:flex;gap:6px;}
  .row-actions .btn-icon{
    width:34px;height:34px;
    font-size:16px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;
  }

  .status-menu{
    position:fixed;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-2);
    padding:6px;
    z-index:150;
    min-width:120px;
  }
  .status-menu .sm-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:var(--radius-s);
    font-size:12.5px;font-weight:600;cursor:pointer;
    color:var(--ink);
  }
  .status-menu .sm-item:hover{background:var(--surface-alt);}
  .status-menu .sm-item.current{background:var(--accent-soft);}
  .status-menu .sm-dot{
    width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;
  }
  .status-menu .sm-dot.stamp-完了{color:var(--good);}
  .status-menu .sm-dot.stamp-進行中{color:var(--accent);}
  .status-menu .sm-dot.stamp-保留{color:var(--hold);}
  .status-menu .sm-dot.stamp-却下{color:var(--danger);}

  .detail-row td{
    background:var(--accent-soft);
    padding:16px 20px 20px;
    border-bottom:1px solid var(--line);
  }
  .detail-grid{display:flex;gap:28px;flex-wrap:wrap;}
  .detail-block{flex:1 1 320px;min-width:260px;}
  .detail-block h4{
    margin:0 0 6px;font-size:11px;color:var(--accent-ink);
    letter-spacing:0.04em;font-weight:800;
  }
  .detail-block p{margin:0;white-space:pre-wrap;color:var(--ink);font-size:13px;}
  .detail-block p.empty{color:var(--ink-faint);font-style:italic;}
  .detail-actions{margin-top:14px;display:flex;gap:8px;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-muted);
  }
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,40,0.42);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:24px;
  }
  .modal{
    background:var(--surface);
    border-radius:var(--radius-l);
    width:100%;max-width:620px;
    max-height:88vh;overflow-y:auto;
    box-shadow:var(--shadow-2);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--surface);
  }
  .modal-head h2{margin:0;font-size:16px;font-weight:800;}
  .modal-body{padding:20px 22px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:11.5px;font-weight:700;color:var(--ink-muted);
    margin-bottom:5px;letter-spacing:0.02em;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
    font-family:var(--font-jp);font-size:13px;color:var(--ink);outline:none;background:var(--surface);
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .field-row{display:flex;gap:12px;}
  .field-check{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);
    background:var(--surface-alt);cursor:pointer;
    font-size:13px;font-weight:700;color:var(--ink);
  }
  .field-check input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer;}
  .field-check small{display:block;font-size:11px;font-weight:500;color:var(--ink-muted);}
  .field-row .field{flex:1;}
  .modal-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 22px;border-top:1px solid var(--line);
    position:sticky;bottom:0;background:var(--surface);
  }

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:12.5px;box-shadow:var(--shadow-2);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .loading-spinner{
    width:34px;height:34px;margin:0 auto;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .confirm-icon{
    width:56px;height:56px;border-radius:50%;
    background:var(--danger-soft);color:var(--danger);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;font-size:26px;

  .confirm-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:10px;}
  .confirm-body{font-size:14px;color:var(--ink-muted);line-height:1.6;}
  .confirm-actions{display:flex;gap:10px;padding:22px 26px 26px;}
  .confirm-actions .btn{flex:1;justify-content:center;font-size:14px;padding:11px 14px;}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-danger:hover{background:#9C3C32;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  @media (max-width:720px){
    .header{flex-direction:column;align-items:stretch;}
    .cell-title{max-width:150px;}
    thead th:nth-child(2), tbody tr[data-id] td:nth-child(2){display:none;}
  }
</style>

/* ============ Utilities ============ */
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function isOverdue(item){
  if(item.ステータス === '完了' || item.ステータス === '却下') return false;
  if(!item.期日) return false;
  return item.期日 < todayStr();
}
function fmtDate(s){
  if(!s) return '—';
  const [y,m,d] = s.split('-');
  return `${y}/${m}/${d}`;
}
function esc(s){
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
function uid(){
  return 'itm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
/* ---- 通し番号 ----
   スプレッドシートの「No」列に保存します。
   No が未設定の案件は、発案日の古い順に既存の最大番号の続きから割り当てます。 */
const NO_KEY = 'No';
const EXEC_KEY = '定例役員MTG';
const AGENDA_GUIDE = { min:1, max:3 }; // 定例役員MTGで話し合う案件数の目安
const EXEC_KEY_OLD = '火曜MTG'; // 旧列名（残っていれば読み取りだけ対応）
let noMap = new Map();
function parseNo(v){ const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; }
function rebuildNumbers(){
  noMap = new Map();
  let max = 0;
  const missing = [];
  state.items.forEach((it, idx)=>{
    const n = parseNo(it[NO_KEY]);
    if(n){ noMap.set(it.id, n); if(n > max) max = n; }
    else missing.push({ it, idx });
  });
  missing.sort((a,b)=>{
    const da = a.it.発案日 || '9999-99-99', db = b.it.発案日 || '9999-99-99';
    if(da !== db) return da < db ? -1 : 1;
    return a.idx - b.idx;
  });
  missing.forEach(({it})=> noMap.set(it.id, ++max));
  return missing.map(m=>m.it);
}
function getNo(item){ return noMap.get(item.id) ?? 0; }
function nextNo(){ let m = 0; noMap.forEach(v=>{ if(v > m) m = v; }); return m + 1; }
// 未設定の通し番号をシートに書き込んで固定する。
// 「No」列が無いときは、まず1件だけ送って列が作られたか確かめてから残りを書き込む
async function backfillNumbers(){
  if(!state.items.length) return;
  let missing = rebuildNumbers();
  if(!missing.length) return;
  try{
    if(!(NO_KEY in state.items[0])){
      const first = missing[0];
      first[NO_KEY] = noMap.get(first.id);
      await apiUpdate(first);
      const latest = await apiList();
      if(!latest.length || !(NO_KEY in latest[0])) return; // 列が作れない（古いApps Script）
      state.items = latest;
      missing = rebuildNumbers();
    }
    for(const it of missing){
      it[NO_KEY] = noMap.get(it.id);
      await apiUpdate(it);
    }
    state.lastSyncedJSON = JSON.stringify(state.items);
  }catch(e){ console.warn('通し番号の書き込みに失敗', e); }
}

/* ---- 定例役員MTG（毎週火曜 社長/取締役/総務課長）に挙げる案件 ---- */
function isExec(item){
  const v = (EXEC_KEY in item) ? item[EXEC_KEY] : item[EXEC_KEY_OLD];
  return v === true || v === 1 || ['true','1','○','済'].includes(String(v).trim().toLowerCase());
}
function execCount(){ return state.items.filter(isExec).length; }
function showExecAgenda(){
  state.fExec = !state.fExec;
  render();
  if(state.fExec){
    const el = document.getElementById('mainArea');
    if(el && window.scrollY === 0) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top - 220), behavior:'smooth' });
  }
}

// おすすめ順：①期限超過を先頭 ②ステータス（進行中→保留→完了→却下） ③期日の近い順（期日なしは後ろ）
function compareRecommended(a, b){
  const oa = isOverdue(a) ? 0 : 1, ob = isOverdue(b) ? 0 : 1;
  if(oa !== ob) return oa - ob;
  const sa = STATUS_ORDER_FOR_SCORE[a.ステータス] ?? 9, sb = STATUS_ORDER_FOR_SCORE[b.ステータス] ?? 9;
  if(sa !== sb) return sa - sb;
  const da = a.期日 || '9999-99-99', db = b.期日 || '9999-99-99';
  if(da < db) return -1;
  if(da > db) return 1;
  return 0;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ Backend API (Google Apps Script + スプレッドシート) ============ */
async function apiList(){
  const res = await fetch(API_URL, { method:'GET' });
  if(!res.ok) throw new Error('list failed: ' + res.status);
  return await res.json();
}
// 送信して、Apps Script から { ok:true } が返ってきたときだけ成功とみなす
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // text/plain でCORSプリフライトを回避
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('通信エラー: ' + res.status);
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('スプレッドシートから正しい応答がありませんでした'); }
  if(!data || data.ok !== true) throw new Error(data && data.error ? data.error : '保存に失敗しました');
  return data;
}
async function apiAdd(item){ return apiPost({ action:'add', item }); }
async function apiUpdate(item){ return apiPost({ action:'update', item }); }
async function apiDelete(id){ return apiPost({ action:'delete', id }); }

async function initData(){
  if(!API_CONFIGURED){
    render(); // renders the "setup needed" banner (see render())
    return;
  }
  render(); // show loading spinner immediately
  try{
    state.items = await apiList();
    state.lastSyncedJSON = JSON.stringify(state.items);
    rebuildNumbers();
    backfillNumbers(); // バックグラウンドで実行
  }catch(e){
    console.error(e);
    showToast('スプレッドシートへの接続に失敗しました');
  }
  state.loading = false;
  render();
}
async function pollApi(){
  if(!API_CONFIGURED || modalItem) return; // 設定前・編集中は同期しない
  try{
    const latest = await apiList();
    const j = JSON.stringify(latest);
    if(j !== state.lastSyncedJSON){
      state.items = latest;
      state.lastSyncedJSON = j;
      rebuildNumbers();
      render();
    }
  }catch(e){ /* 次回のポーリングで再試行 */ }
}

/* ============ Weekly meetings ============ */
// dow: 0=日 1=月 2=火 …  /  duration: 開催中とみなす時間（分）
const MEETINGS = [
  { id:'team',  dow:1, h:9,  m:0, duration:60, title:'総務課内ミーティング',   who:'総務課メンバー全員' },
  { id:'exec',  dow:2, h:10, m:0, duration:60, title:'定例役員ミーティング', who:'社長/取締役/総務課長' },
];
const DOW_JA = ['日','月','火','水','木','金','土'];

// 次回の開催日時（開催中なら今回分）を返す
// 次回の開催日時（開催中なら今回分）
function nextMeetingDate(mt, now){
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), mt.h, mt.m);
  d.setDate(d.getDate() + (mt.dow - now.getDay() + 7) % 7);
  if(d.getTime() + mt.duration*60000 <= now.getTime()) d.setDate(d.getDate() + 7);
  return d;
}
function renderMeetingsInner(){
  const now = new Date();
  const items = MEETINGS.map(mt=>({ mt, start: nextMeetingDate(mt, now) }));
  const nextId = items.reduce((a,b)=> a.start <= b.start ? a : b).mt.id;
  const card = ({mt, start})=>{
    const isToday = start.toDateString() === now.toDateString();
    const live = now >= start;
    const pill = live ? '開催中' : isToday ? '本日' : (mt.id === nextId ? '次回' : '');
    const cls = ['mt', mt.id===nextId?'is-next':'', isToday?'is-today':''].join(' ');
    const agenda = mt.id === 'exec' ? `<span class="mt-guide">毎週${AGENDA_GUIDE.min}〜${AGENDA_GUIDE.max}案件が目安</span>` : '';
    return `
      <div class="${cls}">
        <div class="mt-week" aria-hidden="true">${[1,2,3,4,5].map(d=>`<span class="${d===mt.dow?'on':''}">${DOW_JA[d]}</span>`).join('')}</div>
        <div class="mt-body">
          <div class="mt-when"><span class="mt-time">${mt.h}:${String(mt.m).padStart(2,'0')}<small>〜</small></span><span class="mt-dow">毎週${DOW_JA[mt.dow]}曜日</span></div>
          <div class="mt-title">${mt.title}</div>
          <div class="mt-who">${mt.who}</div>
        </div>
        <div class="mt-side">
          ${pill ? `<span class="mt-pill">${pill}</span>` : ''}
          ${agenda}
        </div>
      </div>`;
  };
  return `
    <div class="mt-head">定例ミーティング<small>毎週の流れ</small></div>
    ${card(items[0])}
    <div class="mt-arrow" aria-hidden="true">
      <svg width="34" height="14" viewBox="0 0 34 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="7" x2="30" y2="7"/><polyline points="24,2 31,7 24,12"/></svg>
      翌日
    </div>
    ${card(items[1])}`;
}
function renderMeetings(){
  return `<section class="meetings" id="meetingStrip" aria-label="定例ミーティング">${renderMeetingsInner()}</section>`;
}
// 「本日」「あとN日」などの表示を1分ごとに更新
setInterval(()=>{
  const el = document.getElementById('meetingStrip');
  if(el) el.innerHTML = renderMeetingsInner();
}, 60000);

/* ============ Summary counts ============ */
// 期日から1カ月が過ぎているか（例：4/15期日 → 5/16以降が「超過」）
function isOverOneMonth(item){
  if(!item.期日) return false;
  const [y,m,d] = String(item.期日).slice(0,10).split('-').map(Number);
  if(!y || !m || !d) return false;
  const limit = new Date(y, m, d); // 1カ月後の同日（月末は自動で翌月にずれる）
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return today > limit;
}
function getSummaryCounts(){
  const open = state.items.filter(i=>i.ステータス === '進行中' || i.ステータス === '保留');
  return {
    progress: state.items.filter(i=>i.ステータス === '進行中').length,
    hold: state.items.filter(i=>i.ステータス === '保留').length,
    stale: open.filter(isOverOneMonth).length,
  };
}
function renderSummary(){
  const c = getSummaryCounts();
  return `
    <div class="summary">
      <div class="sum-card sum-progress">
        <div class="sum-label">進行中</div>
        <div class="sum-num">${c.progress}<span>件</span></div>
      </div>
      <div class="sum-card sum-hold">
        <div class="sum-label">保留中</div>
        <div class="sum-num">${c.hold}<span>件</span></div>
      </div>
      <div class="sum-card sum-stale ${c.stale===0?'zero':''}">
        <div class="sum-label">期日から1カ月超過<small>進行中・保留のうち</small></div>
        <div class="sum-num">${c.stale}<span>件</span></div>
      </div>
    </div>`;
}

/* ============ Derived data ============ */
const ASSIGNEE_ORDER = ['中原 俊和', '平沢 ゆかり', '舘前 流星', 'ドーン 真菜', '中原 ﾏﾘｶﾞｰ ｻﾝﾁｪｽ'];
function getAssignees(){
  const names = [...new Set(state.items.map(i=>i.担当者))];
  return names.sort((a, b)=>{
    const ia = ASSIGNEE_ORDER.indexOf(a);
    const ib = ASSIGNEE_ORDER.indexOf(b);
    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1; // 既知の担当者を先に
    if(ib !== -1) return 1;
    return a.localeCompare(b, 'ja'); // 未知の担当者は50音順で後ろに
  });
}
function filteredSorted(){
  let list = state.items.filter(item=>{
    if(state.search){
      const q = state.search.toLowerCase();
      const no = getNo(item);
      const hay = [item['案件・提案内容'], item['詳細内容'], item.担当者, item['進捗状況コメント'], `no.${no}`, `#${no}`].join(' ').toLowerCase();
      if(/^(no\.?|#)?\s*\d+$/i.test(q.trim())){ if(String(no) === q.replace(/\D/g,'')) return true; }
      if(!hay.includes(q)) return false;
    }
    if(state.fAssignee && item.担当者 !== state.fAssignee) return false;
    if(state.fExec) return isExec(item); // 議題表示中はステータスに関係なく表示
    if(state.fStatuses.length && !state.fStatuses.includes(item.ステータス)) return false;
    return true;
  });

  const dir = state.sortDir === 'asc' ? 1 : -1;
  const key = state.sortKey;
  list.sort((a,b)=>{
    if(key === NO_KEY) return (getNo(a) - getNo(b)) * dir;
    const av = a[key] ?? '', bv = b[key] ?? '';
    if(key === '期日' && (!av || !bv)) return !av && !bv ? 0 : (!av ? 1 : -1); // 期日なしは常に後ろ
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return 0;
  });
  return list;
}

function sortArrow(key){
  if(state.sortKey !== key) return '';
  return state.sortDir === 'asc' ? '▲' : '▼';
}

        <td class="cell-date">
          ${fmtDate(item.発案日)}
        </td>
        <td class="cell-date">
          ${fmtDate(item.期日)}

        </td>

        <td class="cell-exec">

      html += `

        </div>

            <th class="no-sort">操作</th>

function bindTableEvents(list){
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.sortKey === key){
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'asc';
      }
      render();
    });
  });
  document.querySelectorAll('tbody tr[data-id]').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('.btn') || e.target.closest('.stamp') || e.target.closest('.exec-toggle')) return;
      const id = tr.dataset.id;
      state.expandedId = state.expandedId === id ? null : id;
      render();
    });
  });
  document.querySelectorAll('.btn-edit').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = e.target.closest('tr').dataset.id;
      openModal(state.items.find(i=>i.id===id));
    });
  });
  document.querySelectorAll('.btn-edit-detail').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openModal(state.items.find(i=>i.id===state.expandedId));
    });
  });
  document.querySelectorAll('.btn-close-detail').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.expandedId = null;
      render();
    });
  });
  document.querySelectorAll('.btn-delete').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = e.target.closest('tr').dataset.id;
      const item = state.items.find(i=>i.id===id);
      const ok = await confirmDialog('この案件を削除しますか？', `「${item['案件・提案内容']}」を削除します。この操作は取り消せません。`);
      if(ok){
        try{
          await apiDelete(id);
          state.items = state.items.filter(i=>i.id!==id);
          state.lastSyncedJSON = JSON.stringify(state.items);
          showToast('削除しました');
        }catch(err){
          showToast('削除に失敗しました。通信環境をご確認ください');
        }
        render();
      }
    });
  });
  document.querySelectorAll('.exec-toggle').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const item = state.items.find(i=>i.id===btn.closest('tr').dataset.id);
      const prev = item[EXEC_KEY];
      item[EXEC_KEY] = !isExec(item);
      render();
      try{
        await apiUpdate(item);
        state.lastSyncedJSON = JSON.stringify(state.items);
        showToast(item[EXEC_KEY] ? `No.${getNo(item)} を定例役員MTGの議題に挙げました` : `No.${getNo(item)} を定例役員MTGの議題から外しました`);
      }catch(err){
        item[EXEC_KEY] = prev; // ロールバック
        showToast('更新に失敗しました。通信環境をご確認ください');
        render();
      }
    });
  });
  document.querySelectorAll('.stamp').forEach(st=>{
    st.addEventListener('click', (e)=>{
      e.stopPropagation();
      const tr = e.target.closest('tr');
      const id = tr.dataset.id;
      openStatusMenu(st, id);
    });
  });
}

/* ============ Status picker menu ============ */
function closeStatusMenu(){
  const existing = document.getElementById('statusMenu');
  if(existing) existing.remove();
  document.removeEventListener('click', closeStatusMenu, true);
  window.removeEventListener('scroll', closeStatusMenu, true);
}
function openStatusMenu(anchorEl, itemId){
  closeStatusMenu();
  const item = state.items.find(i=>i.id===itemId);
  const rect = anchorEl.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'status-menu';
  menu.id = 'statusMenu';
  menu.innerHTML = STATUS_LIST.map(s=>`
    <div class="sm-item ${s===item.ステータス?'current':''}" data-status="${s}">
      <span class="sm-dot stamp-${s}"></span>${s}
    </div>`).join('');
  document.body.appendChild(menu);

  // position (flip upward if it would overflow the viewport bottom)
  const menuHeight = menu.offsetHeight;
  const spaceBelow = window.innerHeight - rect.bottom;
  let top = spaceBelow >= menuHeight + 8 ? rect.bottom + 6 : rect.top - menuHeight - 6;
  let left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12);
  menu.style.top = `${Math.max(8, top)}px`;
  menu.style.left = `${Math.max(8, left)}px`;

  menu.querySelectorAll('.sm-item').forEach(opt=>{
    opt.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const newStatus = opt.dataset.status;
      if(newStatus !== item.ステータス){
        const prevStatus = item.ステータス;
        item.ステータス = newStatus;
        try{
          await apiUpdate(item);
          state.lastSyncedJSON = JSON.stringify(state.items);
          showToast(`ステータスを「${newStatus}」に変更しました`);
        }catch(err){
          item.ステータス = prevStatus; // ロールバック
          showToast('更新に失敗しました。通信環境をご確認ください');
        }
        render();
      }
      closeStatusMenu();
    });
  });

  // close when clicking anywhere else, or scrolling
  setTimeout(()=>{
    document.addEventListener('click', closeStatusMenu, true);
    window.addEventListener('scroll', closeStatusMenu, true);
  }, 0);
}

/* ============ Custom confirm dialog (centered, styled) ============ */
function confirmDialog(title, message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px;text-align:center;">
        <div style="padding:32px 28px 8px;">
          <div class="confirm-icon">🗑</div>
          <div class="confirm-title">${esc(title)}</div>
          <div class="confirm-body">${esc(message)}</div>
        </div>
        <div class="confirm-actions">
          <button class="btn" id="confirmCancel">キャンセル</button>
          <button class="btn btn-danger" id="confirmOk">削除する</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const finish = (result)=>{ overlay.remove(); resolve(result); };
    overlay.querySelector('#confirmCancel').onclick = ()=>finish(false);
    overlay.querySelector('#confirmOk').onclick = ()=>finish(true);
    overlay.addEventListener('mousedown', e=>{ if(e.target === overlay) finish(false); });
  });
}

/* ============ Modal (add / edit) ============ */
function openModal(item){
  modalItem = item ? {...item} : {
    id: uid(), 発案日: todayStr(), 担当者: '', '案件・提案内容': '', '詳細内容': '',
    期日: todayStr(), ステータス: '進行中', '進捗状況コメント': ''
  };
  const isNew = !item;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>${isNew ? '新規登録' : `案件を編集<span style="margin-left:8px;font-size:13px;color:var(--ink-muted);font-weight:700;">No.${getNo(modalItem)}</span>`}</h2>
        <button class="btn btn-ghost btn-icon" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label>担当者</label>
            <select id="m_assignee_select">
              ${isNew ? `<option value="" ${!modalItem.担当者 ? 'selected' : ''}>担当者を選択してください</option>` : ''}
              ${getAssignees().map(a=>`<option value="${esc(a)}" ${modalItem.担当者===a?'selected':''}>${esc(a)}</option>`).join('')}
              <option value="__other__" ${!getAssignees().includes(modalItem.担当者) && modalItem.担当者 ? 'selected' : ''}>その他（入力する）</option>
            </select>
            <input type="text" id="m_assignee_other" value="${esc(!getAssignees().includes(modalItem.担当者) ? modalItem.担当者 : '')}" placeholder="担当者名を入力"
              style="margin-top:6px;display:${!getAssignees().includes(modalItem.担当者) && modalItem.担当者 ? 'block' : 'none'};">
          </div>
          <div class="field"><label>発案日</label><input type="date" id="m_created" value="${modalItem.発案日}"></div>
        </div>
        <div class="field"><label>案件・提案内容</label><input type="text" id="m_title" value="${esc(modalItem['案件・提案内容'])}" placeholder="件名を入力"></div>
        <div class="field"><label>詳細内容</label><textarea id="m_detail">${esc(modalItem['詳細内容'])}</textarea></div>
        <div class="field-row">
          <div class="field"><label>期日</label><input type="date" id="m_due" value="${modalItem.期日}"></div>
          <div class="field"><label>ステータス</label>
            ${isNew
              ? `<div class="pill" style="background:var(--accent-soft);color:var(--accent-ink);padding:6px 12px;font-size:12.5px;">進行中（新規登録は自動で設定されます）</div>`
              : `<select id="m_status">${STATUS_LIST.map(s=>`<option value="${s}" ${modalItem.ステータス===s?'selected':''}>${s}</option>`).join('')}</select>`
            }
          </div>
        </div>
        <div class="field"><label>進捗状況コメント</label><textarea id="m_comment">${esc(modalItem['進捗状況コメント'])}</textarea></div>
        <label class="field-check">
          <input type="checkbox" id="m_exec" ${isExec(modalItem)?'checked':''}>
          <span>定例役員MTGの議題に挙げる<small>毎週火曜 10:00〜 社長/取締役/総務課長（1〜3案件が目安）</small></span>
        </label>
      </div>
      <div class="modal-foot">
        <span></span>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="modalCancel">キャンセル</button>
          <button class="btn btn-primary" id="modalSave">${isNew ? '登録する' : '保存する'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick = ()=>{ if(!document.getElementById('modalSave').disabled) closeModal(); };
  document.getElementById('modalCancel').onclick = ()=>{ if(!document.getElementById('modalSave').disabled) closeModal(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target === overlay && !document.getElementById('modalSave').disabled) closeModal(); });
  const assigneeSelect = document.getElementById('m_assignee_select');
  const assigneeOther = document.getElementById('m_assignee_other');
  assigneeSelect.addEventListener('change', ()=>{
    if(assigneeSelect.value === '__other__'){
      assigneeOther.style.display = 'block';
      assigneeOther.focus();
    } else {
      assigneeOther.style.display = 'none';
    }
  });
  document.getElementById('modalSave').onclick = async ()=>{
    const saveBtn = document.getElementById('modalSave');
    if(saveBtn.disabled) return; // 連打による二重登録を防ぐ

    const assignee = (assigneeSelect.value === '__other__' ? assigneeOther.value : assigneeSelect.value).trim();
    const title = document.getElementById('m_title').value.trim();
    if(!assignee || !title){
      showToast('担当者と案件名は必須です');
      return;
    }
    modalItem.担当者 = assignee;
    modalItem['案件・提案内容'] = title;
    modalItem['詳細内容'] = document.getElementById('m_detail').value;
    modalItem.発案日 = document.getElementById('m_created').value || todayStr();
    modalItem.期日 = document.getElementById('m_due').value || todayStr();
    delete modalItem.緊急度; // 旧項目（シートに残っていても送信しない）
    delete modalItem.優先度;
    modalItem.ステータス = isNew ? '進行中' : document.getElementById('m_status').value;
    modalItem['進捗状況コメント'] = document.getElementById('m_comment').value;
    modalItem[EXEC_KEY] = document.getElementById('m_exec').checked;
    if(isNew || !parseNo(modalItem[NO_KEY])) modalItem[NO_KEY] = isNew ? nextNo() : getNo(modalItem);

    const originalLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.7';
    saveBtn.style.cursor = 'not-allowed';
    saveBtn.textContent = isNew ? '登録中…' : '保存中…';
    document.getElementById('modalCancel').disabled = true;

    try{
      if(isNew){
        await apiAdd(modalItem);
        state.items.unshift(modalItem);
      } else {
        await apiUpdate(modalItem);
        const idx = state.items.findIndex(i=>i.id===modalItem.id);
        if(idx >= 0){ state.items[idx] = modalItem; }
      }
      state.lastSyncedJSON = JSON.stringify(state.items);
      rebuildNumbers();
      closeModal();
      showToast(isNew ? '登録しました' : '保存しました');
    }catch(err){
      showToast('保存に失敗しました。通信環境をご確認ください');
      saveBtn.disabled = false;
      saveBtn.style.opacity = '';
      saveBtn.style.cursor = '';
      saveBtn.textContent = originalLabel;
      document.getElementById('modalCancel').disabled = false;
      return;
    }
    render();
  };
}
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.remove();
  modalItem = null;
}

/* ============ Boot ============ */
window.addEventListener('scroll', ()=>{
  const el = document.getElementById('stickyTop');
  if(el) el.classList.toggle('stuck', window.scrollY > 0);
}, { passive:true });
initData();
setInterval(pollApi, 5000);
</script>
